  frontend:
    image: nginx:alpine
    container_name: orbit-frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Static frontend files
      - ./index.html:/usr/share/nginx/html/index.html:ro
      - ./careers.html:/usr/share/nginx/html/careers.html:ro
      - ./admin.html:/usr/share/nginx/html/admin.html:ro
      - ./css:/usr/share/nginx/html/css:ro
      - ./js:/usr/share/nginx/html/js:ro
      - ./images:/usr/share/nginx/html/images:ro
      - ./video:/usr/share/nginx/html/video:ro

      # Nginx config
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

      # 🔐 LET'S ENCRYPT CERTIFICATES (THIS IS THE KEY FIX)
      - /etc/letsencrypt:/etc/letsencrypt:ro

    depends_on:
      - backend
    networks:
      - orbit-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost"]
      interval: 30s
      timeout: 10s
      retries: 3
